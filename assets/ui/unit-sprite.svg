<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 96">
  <defs>
    <linearGradient id="helm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8c547"/>
      <stop offset="100%" stop-color="#8b5a10"/>
    </linearGradient>
    <linearGradient id="armor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c45030"/>
      <stop offset="100%" stop-color="#5a1810"/>
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0d0b0"/>
      <stop offset="100%" stop-color="#c49068"/>
    </linearGradient>
  </defs>
  <!-- shadow -->
  <ellipse cx="40" cy="90" rx="22" ry="5" fill="#000" opacity="0.35"/>
  <!-- legs -->
  <rect x="28" y="62" width="10" height="22" rx="2" fill="#2a1810"/>
  <rect x="42" y="62" width="10" height="22" rx="2" fill="#2a1810"/>
  <!-- body armor -->
  <path d="M24,38 L56,38 L54,64 L26,64 Z" fill="url(#armor)"/>
  <path d="M30,40 L50,40 L48,52 L32,52 Z" fill="#e8c547" opacity="0.35"/>
  <!-- arms -->
  <rect x="14" y="40" width="12" height="8" rx="3" fill="url(#armor)"/>
  <rect x="54" y="40" width="12" height="8" rx="3" fill="url(#armor)"/>
  <!-- head -->
  <circle cx="40" cy="28" r="12" fill="url(#skin)"/>
  <!-- helmet -->
  <path d="M26,26 Q40,10 54,26 L50,30 Q40,22 30,30 Z" fill="url(#helm)"/>
  <rect x="36" y="8" width="8" height="10" rx="1" fill="#e8c547"/>
  <!-- plume -->
  <path d="M40,8 Q34,0 38,-2 Q42,2 40,8" fill="#c4281c"/>
  <!-- face hint -->
  <circle cx="35" cy="28" r="1.5" fill="#1a1008"/>
  <circle cx="45" cy="28" r="1.5" fill="#1a1008"/>
  <path d="M36,34 Q40,36 44,34" stroke="#8b4a28" stroke-width="1.2" fill="none"/>
</svg>
