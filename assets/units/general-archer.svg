<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" fill="none">
  <defs>
    <linearGradient id="aArmor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ab8d0"/><stop offset="50%" stop-color="#2a6a88"/><stop offset="100%" stop-color="#0e2840"/>
    </linearGradient>
    <linearGradient id="aSkin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5d4b0"/><stop offset="100%" stop-color="#c89870"/>
    </linearGradient>
    <linearGradient id="aHelm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8d080"/><stop offset="100%" stop-color="#8a6420"/>
    </linearGradient>
  </defs>
  <ellipse cx="60" cy="150" rx="30" ry="6" fill="#000" opacity="0.35"/>
  <!-- legs -->
  <path d="M44,110 L40,146 L52,146 L54,112 Z" fill="#1a2838"/>
  <path d="M76,110 L68,112 L70,146 L82,146 Z" fill="#1a2838"/>
  <rect x="38" y="142" width="15" height="5" rx="1" fill="#6a8088"/>
  <rect x="68" y="142" width="15" height="5" rx="1" fill="#6a8088"/>
  <!-- robe -->
  <path d="M38,58 L82,58 L90,112 L30,112 Z" fill="url(#aArmor)"/>
  <path d="M48,66 L72,66 L70,100 L50,100 Z" fill="#a0d0e8" opacity="0.2"/>
  <rect x="36" y="98" width="48" height="6" fill="#c9a227"/>
  <!-- quiver -->
  <rect x="84" y="70" width="12" height="36" rx="2" fill="#5a3a18" stroke="#c9a227" stroke-width="1"/>
  <line x1="88" y1="68" x2="88" y2="58" stroke="#e8c070" stroke-width="1.5"/>
  <line x1="92" y1="68" x2="94" y2="56" stroke="#e8c070" stroke-width="1.5"/>
  <line x1="96" y1="70" x2="98" y2="60" stroke="#e8c070" stroke-width="1.5"/>
  <!-- bow -->
  <path d="M22,48 Q8,80 22,116" stroke="#c89850" stroke-width="3.5" fill="none"/>
  <line x1="22" y1="50" x2="22" y2="114" stroke="#e8d0a0" stroke-width="1" opacity="0.7"/>
  <!-- arms -->
  <path d="M38,64 L24,78 L30,84 L44,70 Z" fill="url(#aArmor)"/>
  <path d="M82,64 L96,72 L92,80 L78,70 Z" fill="url(#aArmor)"/>
  <!-- head -->
  <ellipse cx="60" cy="42" rx="17" ry="19" fill="url(#aSkin)"/>
  <path d="M42,40 Q60,14 78,40 L74,48 Q60,36 46,48 Z" fill="url(#aHelm)"/>
  <path d="M42,42 L36,50 L44,52" fill="#2a6a88"/>
  <path d="M78,42 L84,50 L76,52" fill="#2a6a88"/>
  <circle cx="53" cy="44" r="1.8" fill="#1a1008"/>
  <circle cx="67" cy="44" r="1.8" fill="#1a1008"/>
  <path d="M55,52 Q60,55 65,52" stroke="#8b4a28" stroke-width="1.3" fill="none"/>
  <ellipse cx="36" cy="60" rx="9" ry="6" fill="url(#aHelm)"/>
  <ellipse cx="84" cy="60" rx="9" ry="6" fill="url(#aHelm)"/>
</svg>
